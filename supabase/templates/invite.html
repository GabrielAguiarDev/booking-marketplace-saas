<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 32px 20px;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
    "
  >
    <table
      role="presentation"
      style="max-width: 420px; margin: 0 auto; background: #fff; border-radius: 18px; padding: 32px"
    >
      <tr>
        <td>
          <p style="margin: 0 0 6px; font-size: 11px; letter-spacing: 0.12em; color: #71757a">
            VEZ
          </p>
          <h1 style="margin: 0 0 14px; font-size: 22px; color: #14171a">
            {{ if .Data.full_name }}{{ .Data.full_name }}, você{{ else }}Você{{ end }} foi convidado
            para o Vez
          </h1>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #4a4e52">
            Aceite o convite para criar sua senha e entrar na equipe.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                padding: 12px 20px;
                border-radius: 12px;
                background: #14171a;
                color: #fff;
                font-size: 15px;
                font-weight: 600;
                text-decoration: none;
              "
              >Aceitar convite</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #71757a">
            O link vale por 24 horas e pode ser usado uma vez. Se você não esperava este convite,
            ignore este e-mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
